<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Chatkontrolle Ticker</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#fff; }
  .ticker-wrap { overflow:hidden; white-space:nowrap; border-top:3px solid #ff3b30; border-bottom:3px solid #ff3b30; padding:10px 0; background:#1a1a1a; }
  .ticker { display:inline-block; animation: scroll 180s linear infinite; }
  .ticker span { margin-right:80px; }
  .ticker span::before { content:"● "; color:#ff3b30; }
  @keyframes scroll { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
  .meta { font-size:0.8em; opacity:0.6; padding:8px 12px; }
  a { color:#4da3ff; text-decoration:none; }
</style>
</head>
<body>
<div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>
<div class="meta">Quellen: Heise, Netzpolitik, EU-Parlament | Stand: 09.07.2026 Reaktivierung 1.0 | 2.0 noch im Trilog | 
<a href="https://www.patrick-breyer.de/en/posts/chat-control/" target="_blank">Patrick Breyer Dossier</a> | 
<a href="https://www.tagesschau.de/thema/chatkontrolle" target="_blank">Tagesschau</a></div>

<script>
const headlines = [
  "09.07.2026: Chatkontrolle 1.0 per Eilverfahren reaktiviert - 314:276 scheitert an 361-Mehrheit - gilt bis 04/2028",
  "26.03.2026: Parlament lehnte Verlängerung mit 311:228 ab - freiwilliges Scannen lief am 03.04. aus",
  "07.07.2026: Dringlichkeitsverfahren mit 331:304 angenommen - Kritik als 'unlauteres Manöver' (Birgit Sippel)",
  "Chatkontrolle 2.0 (Pflicht-Client-Side-Scanning): NICHT beschlossen - weiter im Trilog",
  "Signal & Threema: Würden Verschlüsselung nicht schwächen - drohen mit Rückzug aus EU",
  "Aktuell: Trilog läuft - zyprische Ratspräsidentschaft strebt Einigung bis Ende Juni an"
];

const ticker = document.getElementById('ticker');
ticker.innerHTML = headlines.map(h => `<span>${h}</span>`).join("") + headlines.map(h => `<span>${h}</span>`).join("");

// Optional: Live-RSS via rss2json (CORS-frei) - ODER https://netzpolitik.org/feed/, einfach einkommentieren
 fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.heise.de/rss/heise.rdf')
   .then(r=>r.json()).then(d=>{
     const live = d.items.slice(0,3).map(i=> i.title);
     ticker.innerHTML += live.map(h=>`<span>LIVE: ${h}</span>`).join("");
   });
</script>
</body>
</html>
